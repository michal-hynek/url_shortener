[package]
name = "url_shortener"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
axum = "0.8.9"
r2d2 = "0.8.10"
r2d2_sqlite = "0.34.0"
# there's a version conflict for libsqlite3-sys in the latest version of rusqlite
rusqlite = { version = "0.39.0", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["full"] }
